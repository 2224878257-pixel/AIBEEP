<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>来源与发现 · AIBEEP</title><meta name="description" content="AIBEEP候选来源目录、已测试采集入口和全网搜索运行状态。候选来源不等于已经接入。"><link rel="canonical" href="https://aibeep.cn/sources.html"><style>
:root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--ink:#182c40;--muted:#566576;--line:#dce1e7;--accent:#bd5600}html[data-theme=dark]{color-scheme:dark;--bg:#101820;--panel:#18232f;--ink:#e8eff7;--muted:#b1becd;--line:#344353;--accent:#ffb55b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:30px 20px}a{color:var(--accent)}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:28px;margin-bottom:5px}p{color:var(--muted)}button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.filters,.stats{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}.stats span{background:var(--panel);padding:10px 15px;border:1px solid var(--line);border-radius:8px}article,section.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:12px 0}h2{font-size:20px}h3{font-size:16px;margin:0}small{color:var(--muted)}.meta{overflow-wrap:anywhere;margin:8px 0 0}.badge{font-size:12px;margin-left:8px;color:var(--accent)}#catalog{display:grid;grid-template-columns:1fr 1fr;gap:12px}#catalog article{margin:0}#searchState{font-weight:600;color:var(--ink)}@media(max-width:650px){#catalog{grid-template-columns:1fr}h1{font-size:23px}.filters input{width:100%}}
</style></head><body><main><header><a href="index.html">← AIBEEP</a><button id="theme" aria-label="切换日夜模式">日 / 夜</button></header><h1>来源与发现</h1><p>固定订阅、关键词检索与新来源线索结合。候选目录不等于已接入，页面可访问也不等于正文可读。</p><div id="stats" class="stats"></div><section class="panel"><h2>最近批处理</h2><p id="searchState">正在读取运行状态…</p><p id="runSummary"></p><small>日期为最近一次实测，不代表持续可用。搜索摘要只作线索，未读取正文的内容不会直接发布。没有密钥时仍运行免费固定来源。</small></section><section class="panel"><h2>已启用采集端点</h2><div id="active">正在读取…</div></section><h2>64 个候选入口</h2><p>平台按本目录根域名合并；同平台的栏目分别列出。作者仅计已核实的具体身份，平台首页不算具体作者接入。</p><div class="filters"><input id="q" aria-label="搜索来源" placeholder="搜索来源、栏目或关注主题"><select id="method" aria-label="筛选采集方式"><option value="all">所有方式</option><option>rss</option><option>official_api</option><option>public_page</option><option>search_only</option><option>manual</option><option>auth_required</option><option>blocked</option></select></div><p id="count"></p><div id="catalog"></div><p><a href="mailto:2224878257@qq.com?subject=AIBEEP选题提交">向侯同学呀提交公开原文或作者订阅</a></p></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'未记录').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=u=>typeof u==='string'&&/^https?:\/\//.test(u)?u:'#';let rows=[];
const saved=localStorage.getItem('aibeep.theme.v1');document.documentElement.dataset.theme=saved||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('aibeep.theme.v1',t);};
async function read(name){const r=await fetch(name+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(name);return r.json();}
function render(){const q=$('#q').value.toLowerCase(),method=$('#method').value;const list=rows.filter(r=>(method==='all'||r.method===method)&&[r.name,r.focus,r.group,r.domain].some(v=>String(v||'').toLowerCase().includes(q)));$('#count').textContent=`显示 ${list.length} / ${rows.length} 个入口`;$('#catalog').innerHTML=list.map(r=>`<article><h3>${esc(r.name)}<span class="badge">${r.enabled?'有已启用端点':'候选入口'}</span></h3><small>${esc(r.group)} · ${esc(r.method)}</small><p>${esc(r.focus)}</p><small>${esc(r.fit_assessment)}</small><p class="meta"><a href="${esc(link(r.entry_url))}" target="_blank" rel="noopener noreferrer">${esc(r.entry_url)}</a></p><p class="meta">页面可访问：${r.page_accessible?'是':'本次未成功'} · 正文样本：${r.body_readable?'已读取':'未取得'} · 持续采集：${r.sustainable?'已测试端点':'未启用'}</p><small>最近测试 ${esc(r.last_checked_at)}<br>最近错误：${esc(r.last_error||r.sample_error||'无')}<br>方式说明：${r.enabled?'仅通过已测试的具体端点运行':'仅用于发现线索；尚未加入定时采集'}</small></article>`).join('');}
$('#q').oninput=render;$('#method').onchange=render;
read('source_catalog.json').then(r=>{rows=r;render();}).catch(()=>$('#catalog').textContent='目录暂时无法读取，请稍后重试。');
read('source_catalog_summary.json').then(s=>$('#stats').innerHTML=[['候选入口',s.candidate_entries],['平台',s.unique_platforms],['独立域名',s.unique_domains],['已测试入口',s.tested_entries],['启用入口',s.enabled_entries],['启用采集端点',s.enabled_endpoints],['最近测试成功端点',s.successful_endpoints],['已核实作者',s.authors_verified]].map(([k,v])=>`<span>${esc(k)} <b>${Number(v)||0}</b></span>`).join(''));
read('source_status.json').then(rs=>$('#active').innerHTML=rs.filter(r=>r.enabled).map(r=>`<p><strong>${esc(r.name)}</strong> · ${esc(r.language)} · ${esc(r.method)}<br><a href="${esc(link(r.url))}" target="_blank" rel="noopener noreferrer">采集入口 ↗</a> · <a href="${esc(link(r.official_url))}" target="_blank" rel="noopener noreferrer">官网 ↗</a><br><small>最近成功：${esc(r.last_success_at)}；最近错误：${esc(r.last_error||'无')}</small></p>`).join('')).catch(()=>$('#active').textContent='采集状态暂时无法读取。');
read('discovery_status.json').then(s=>{const names={not_configured:'全网搜索尚未启用：未配置搜索密钥',storage_rights_not_confirmed:'全网搜索尚未启用：尚未确认结果存储权限',success:'全网搜索已运行',partial:'全网搜索部分完成',check_only:'本轮仅检查免费来源',unsupported_provider:'搜索提供商暂未支持'};$('#searchState').textContent=names[s.search?.state]||'暂无搜索运行记录';const n=s.summary||{};$('#runSummary').textContent=`最近批处理 ${s.run_at}；查询 ${n.queries||0} 次，发现 ${n.discovered_urls||0} 个URL，读取 ${n.readable||0} 篇，去重 ${n.duplicates||0} 条，通过筛选 ${n.qualified||0} 条，新生成 ${n.generated||0} 条。`;}).catch(()=>$('#searchState').textContent='尚无本版批处理记录；请查看采集端点测试结果。');
</script></body></html>
