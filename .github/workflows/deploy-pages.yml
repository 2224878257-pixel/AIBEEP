name: AIBEEP GitHub Pages (manual release gate)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["AIBEEP official feeds and AI audit"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: aibeep-pages-deployment
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify static output
        run: |
          test -s dist/index.html
          test -s dist/content.json
          test -s dist/articles.json
          python -m json.tool dist/content.json > /dev/null
          python -m json.tool dist/articles.json > /dev/null

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && vars.AIBEEP_ENABLE_PUBLIC_PAGES == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
