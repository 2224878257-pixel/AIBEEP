name: Daily collection and Pages
on:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'data.json', 'archive.json', 'assets/**', 'media.py', 'discovery.py', 'robots.txt', 'sitemap.xml', 'collection_status.json', 'collection_history.json', 'scraper.py', 'sources.json', 'requirements.txt', '.github/workflows/daily.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: aibeep-daily-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      scrape_outcome: ${{ steps.scrape.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Chinese and English OCR
        if: github.event_name != 'push'
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
      - run: python -m unittest discover -s tests -v
      - name: Restore editorial review queue
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: review_queue.json
          key: aibeep-review-v1-${{ github.run_id }}
          restore-keys: aibeep-review-v1-
      - name: Collect public sources
        id: scrape
        continue-on-error: true
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
        run: |
          python scraper.py --limit 6
      - name: Upload collection report
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: run_report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload editorial review queue
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: editorial-review-queue
          path: review_queue.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collection_status.json collection_history.json
          if [ -f screening_cache.json ]; then git add screening_cache.json; fi
          if [ '${{ steps.scrape.outcome }}' = 'success' ]; then
            git add data.json archive.json
            if [ -d assets/images ]; then git add assets/images; fi
          else git restore data.json archive.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'content: refresh official growth news'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare public files only
        run: |
          mkdir site
          cp index.html data.json archive.json site/
          cp robots.txt sitemap.xml site/
          if [ -d assets ]; then cp -R assets site/; fi
          if [ -f collection_status.json ]; then cp collection_status.json site/; fi
          if [ -f collection_history.json ]; then cp collection_history.json site/; fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failure after publishing status
        if: needs.collect.outputs.scrape_outcome == 'failure'
        run: exit 1
