name: Daily collection and Pages
on:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'data.json', 'scraper.py', 'sources.json', 'requirements.txt', '.github/workflows/daily.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: aibeep-daily-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect public sources
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
        run: |
          python -m playwright install --with-deps chromium
          python scraper.py --browser --limit 3
      - name: Upload collection report
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: run_report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'content: refresh official growth news'
            git push origin HEAD:main
          fi
      - name: Prepare public files only
        run: |
          mkdir site
          cp index.html data.json site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
