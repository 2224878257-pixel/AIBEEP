services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIBEEP_DB_PATH: /data/aibeep.sqlite3
      AIBEEP_HOST: 0.0.0.0
      AIBEEP_PORT: 8080
      AIBEEP_ADMIN_TOKEN: ${AIBEEP_ADMIN_TOKEN:-}
    volumes:
      - aibeep-data:/data
  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "scheduler.py", "--interval-hours", "6"]
    environment:
      AIBEEP_DB_PATH: /data/aibeep.sqlite3
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_REVIEW_MODEL: ${DEEPSEEK_REVIEW_MODEL:-deepseek-flash}
    volumes:
      - aibeep-data:/data
      - ./review_queue.json:/app/review_queue.json
volumes:
  aibeep-data:
