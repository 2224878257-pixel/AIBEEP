<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIBEEP · 广告投放 / 企业获客 / 营销 / AI+增长</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF8200'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<script src="https://fastly.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  /* ===== 设计 token：微博式清爽灰白 + 赤陶强调 ===== */
  :root{
    --bg:#F5F6F8; --card:#FFFFFF;
    --ink:#1F2329; --ink-2:#3C4043; --ink-3:#8A8F99;
    --line:#EBEDEF; --line-soft:#F2F3F5;
    --accent:#FF8200; --accent-soft:#FFF3E8; --accent-ink:#D66A00;
    --shadow:0 1px 3px rgba(31,35,41,.04), 0 1px 2px rgba(31,35,41,.03);
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Source Han Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:1.7;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(250,250,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:4px;color:var(--ink)}
  @media(max-width:1079px){.menu-btn{display:flex;align-items:center;justify-content:center}}
  .brand .mark{width:29px;height:29px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:.5px;flex:none}
  .brand .word{font-size:17px;font-weight:800;letter-spacing:2.5px;color:var(--ink)}
  .brand .word span{color:var(--accent)}
  .brand small{display:block;font-weight:500;font-size:9.5px;color:var(--ink-3);letter-spacing:2.5px;margin-top:1px}
  .topbar .spacer{flex:1}
  .today{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .today b{color:var(--accent);font-weight:700}
  .today .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:260px;flex:0 1 380px;background:#fff}
  .search svg{width:16px;height:16px;stroke:var(--ink-3);flex:none}
  .search input{background:transparent;border:none;outline:none;color:var(--ink);font-size:13.5px;width:100%}
  .search input::placeholder{color:var(--ink-3)}
  .avatar{width:29px;height:29px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none;cursor:pointer;border:none}
  @media(max-width:759px){.today{display:none}.search{min-width:0;flex:1}}

  /* ===== 主体 ===== */
  .shell{max-width:1280px;margin:0 auto;display:grid;gap:24px;padding:22px 20px 60px;grid-template-columns:minmax(0,1fr)}
  @media(min-width:1080px){.shell{grid-template-columns:180px minmax(0,1fr) 260px;align-items:start}}
  body.no-side .side{display:none}
  @media(min-width:1080px){body.no-side .shell{grid-template-columns:180px minmax(0,1fr)}}

  /* ===== 左侧功能导航 ===== */
  .rail{position:sticky;top:74px}
  @media(max-width:1079px){
    .rail{display:none;position:fixed;top:53px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px;max-height:70vh;overflow-y:auto;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.06)}
    .rail.open{display:block}
  }
  .rail .grp{margin-bottom:22px}
  .rail h3{font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:2px;margin:0 0 9px;padding-left:11px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink-2);white-space:nowrap;transition:all .15s;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
  .nav-item:hover{color:var(--ink);background:var(--line-soft)}
  .nav-item svg{width:16px;height:16px;flex:none;stroke-width:1.8}
  .nav-item .n{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:600}
  .nav-item.active{background:var(--accent);color:#fff}
  .nav-item.active .n{color:#C9CDD2}

  /* ===== 主列 ===== */
  .main{min-width:0}
  .hero{margin-bottom:18px}
  .hero .kicker{font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .hero .kicker::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px}
  .fmag{display:grid;gap:12px;grid-template-columns:1fr;align-items:start}
  @media(min-width:800px){.fmag{grid-template-columns:1.6fr 1fr}}
  .fmain{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;box-shadow:var(--shadow)}
  .fmain-no{font-size:11px;color:var(--ink-3);letter-spacing:1px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .fmain-tag{font-size:10px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:4px;letter-spacing:0}
  .fmain h3{font-size:16px;font-weight:800;line-height:1.5;margin-bottom:8px}
  .fmain:hover h3{color:var(--accent-ink)}
  .fmain p{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fmain-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);padding-top:10px;border-top:1px solid var(--line)}
  .fmag-side{display:flex;flex-direction:column;gap:12px}
  .fmini{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
  .fmini:hover{border-color:var(--accent)}
  .fmini-no{font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .fmini-heat{font-size:13px;color:var(--accent-ink);font-weight:800}
  .fmini h4{font-size:13.5px;font-weight:700;line-height:1.5;margin-bottom:4px}
  .fmini:hover h4{color:var(--accent-ink)}
  .fmini p{font-size:11.5px;color:var(--ink-2);line-height:1.55;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .fmini-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}

  .focus-row3{display:grid;gap:12px}
  @media(min-width:700px){.focus-row3{grid-template-columns:repeat(3,1fr)}}
  .f3{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .f3:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .f3-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .f3-rk{font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:4px}
  .f3-src{font-size:11px;color:var(--ink-3)}
  .f3 h4{font-size:13.5px;font-weight:700;line-height:1.55;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .f3:hover h4{color:var(--accent-ink)}
  .f3-meta{font-size:11.5px;color:var(--ink-3)}
  .mag{display:grid;gap:12px}
  @media(min-width:760px){
    .mag{grid-template-columns:1.5fr 1fr;align-items:stretch}
    .mag-side{display:grid;grid-template-rows:repeat(3,84px);gap:12px}
  }
  .mag-main{grid-column:1;grid-row:1}
  @media(max-width:759px){.mag-side{display:grid;gap:12px;grid-template-columns:1fr 1fr}}
  .focus-list{display:flex;flex-direction:column}
  .focus-row{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .focus-row:last-child{border-bottom:none;padding-bottom:4px}
  .focus-row:hover .fr-body h3{color:var(--accent-ink)}
  .fr-rk{flex:none;width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .fr-body{flex:1;min-width:0}
  .fr-tags{display:flex;gap:6px;margin-bottom:6px}
  .fr-body h3{font-size:15px;font-weight:700;line-height:1.5;margin-bottom:5px}
  .fr-meta{font-size:12px;color:var(--ink-3);display:flex;gap:12px}

  .mag-card{position:relative;border:1px solid var(--line);border-radius:7px;overflow:hidden;cursor:pointer;background:#23272E;display:block}
  .mag-mini{min-height:84px}
  .mag-main{min-height:276px}
  .mag-card:hover{border-color:var(--ink)}
  .mag-card .cover{position:absolute;inset:0;background:#23272E;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35)}
  .mag-card .cover svg{width:20px;height:20px;stroke-width:1.4}
  .mag-card .f-body{position:absolute;left:0;right:0;bottom:0;padding:11px 13px 10px;color:#fff;z-index:2;background:linear-gradient(180deg,rgba(20,22,26,0) 0%,rgba(20,22,26,.82) 100%)}
  .mag-card .ftags{font-size:10.5px;color:rgba(255,255,255,.6);margin-bottom:5px;letter-spacing:.3px}
  .mag-card .f-title{font-size:13.5px;line-height:1.45;font-weight:600;color:#fff}
  .mag-mini .f-title{font-size:12px}
  .mag-card:hover .f-title{color:#fff}
  .mag-card .src{margin-top:6px;font-size:10.5px;color:rgba(255,255,255,.6);display:flex;justify-content:space-between}

  /* 平台/行业 chips 行 */
  .chiprow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chiprow .lab{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.5px;margin-right:2px}
  .chiprow .sep{width:1px;height:16px;background:var(--line);margin:0 6px}
  .chip{font-size:12.5px;color:var(--ink-2);border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .bar{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
  .bar h2{font-size:15px;font-weight:800}
  .bar .cnt{font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);background:#fff;padding:0 8px;border-radius:20px;font-weight:600}
  .bar .filters{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

  .feed{display:flex;flex-direction:column}
  .flow-item{padding:18px 12px;border-bottom:1px solid var(--line);cursor:pointer;margin:0 -12px;border-radius:6px;transition:background .12s}
  .flow-item:hover{background:var(--line-soft)}
  .flow-item:last-child{border-bottom:none}
  .flow-item:hover h3{color:var(--accent-ink)}
  .flow-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .flow-time{font-size:12px;color:var(--ink-3);font-weight:600}
  .flow-dot{color:var(--line);margin:0 2px}
  .flow-score{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:4px}
  .flow-item h3{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:6px}
  .flow-desc{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-bottom:10px}
  .flow-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3)}
  .flow-actions{display:flex;align-items:center;gap:12px}
  .flow-heat{display:flex;align-items:center;gap:3px}
  .star{background:none;border:none;cursor:pointer;color:var(--ink-3);padding:2px}
  .star.on{color:var(--accent)}
  .star svg{width:15px;height:15px}

  .card{display:flex;gap:16px;padding:17px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;border-radius:8px;position:relative}
  .card:last-child{border-bottom:none}
  .card:hover{background:var(--card)}
  .card .time{flex:none;width:42px;font-size:11px;color:var(--ink-3);font-weight:600;text-align:right;padding-top:2px;line-height:1.5}
  .card .time b{display:block;color:var(--ink-2);font-size:12px;font-weight:700}
  .card .body{min-width:0;flex:1}
  .card.unread::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;border-radius:2px;background:var(--line)}
  .card.read h3{color:var(--ink-3);font-weight:600}
  .card .head{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:500;letter-spacing:.2px;padding:0;border-radius:0;background:transparent;color:var(--ink-3);border:none;cursor:default}
  .tag.ch{color:var(--ink-2);font-weight:600}
  .tag.ai{color:var(--ink-3);font-weight:600}
  .card .score{margin-left:auto;display:flex;align-items:center;gap:5px}
  .card .score .lab{font-size:10px;color:var(--ink-3);letter-spacing:.5px}
  .card .score .val{font-weight:700;font-size:12.5px;color:var(--accent-ink);border:1px solid #FFD9B3;background:var(--accent-soft);padding:1px 7px;border-radius:5px;line-height:1.7}
  .card .co{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);border:1px solid var(--line);background:#fff;border-radius:4px;padding:1px 8px;cursor:pointer}
  .card .co svg{width:12px;height:12px}
  .card h3{font-size:15.5px;font-weight:700;line-height:1.5;letter-spacing:.2px}
  .card .desc{font-size:13px;color:var(--ink-2);margin-top:5px;line-height:1.7}
  .card .reason{margin-top:9px;font-size:12.5px;color:var(--ink-2);line-height:1.7;display:flex;gap:8px;align-items:flex-start;border-left:2px solid var(--line);padding:1px 0 1px 10px}
  .card .reason b{color:var(--ink-3);font-weight:600;flex:none;font-size:11px;letter-spacing:.3px;padding-top:2px}
  .card .meta{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:11.5px;color:var(--ink-3)}
  .card .meta .src{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--ink-2);border-bottom:1px solid transparent}
  .card .meta .src:hover{color:var(--accent-ink);border-bottom-color:var(--accent)}
  .card .meta .src svg{width:12px;height:12px}
  .card .heat{margin-left:auto;display:flex;align-items:center;gap:3px}
  .card .heat svg{width:12px;height:12px}
  .card .star{margin-left:6px;background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center}
  .card .star svg{width:16px;height:16px;stroke:var(--ink-3)}
  .card .star.on svg{fill:var(--accent);stroke:var(--accent)}
  .empty{text-align:center;padding:50px 20px;color:var(--ink-3);font-size:13.5px;border:1px dashed var(--line);border-radius:8px}
  .empty button{margin-top:10px}

  /* 精选页 */
  .feat-grid{display:grid;gap:16px}
  @media(min-width:760px){.feat-grid{grid-template-columns:1fr 1fr}}
  .feat-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
  .feat-card:hover{border-color:var(--accent)}
  .feat-cover{background:#23272E;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.4)}
  .feat-cover svg{width:26px;height:26px;stroke-width:1.4}
  .feat-cover small{font-size:10px;letter-spacing:.5px;opacity:.7}
  .feat-body{padding:16px 18px 15px}
  .feat-tags{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .feat-score{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:4px}
  .feat-body h3{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:8px}
  .feat-card:hover .feat-body h3{color:var(--accent-ink)}
  .feat-desc{font-size:13px;color:var(--ink-2);line-height:1.7;margin-bottom:10px}
  .feat-reason{font-size:12.5px;color:var(--ink-2);line-height:1.7;border-left:2px solid var(--accent);padding:1px 0 1px 10px;margin-bottom:12px}
  .feat-reason b{color:var(--accent-ink);font-weight:700;font-size:11px;margin-right:4px}
  .feat-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)}

  /* 热点榜页 */
  .hotboard .hot-tabs{display:flex;gap:6px;margin-bottom:14px}
  .hotboard .hot-tabs button{font-size:13px;padding:5px 16px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:var(--ink-2)}
  .hotboard .hot-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .hb-list{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
  .hb-row{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
  .hb-row:last-child{border-bottom:none}
  .hb-row:hover{background:var(--bg)}
  .hb-rank{flex:none;width:28px;font-size:22px;font-weight:800;font-family:Georgia,serif;font-style:italic;text-align:center;line-height:1}
  .hb-rank.r1{color:#FF2E4C}.hb-rank.r2{color:#FF6B00}.hb-rank.r3{color:#FF8200}
  .hb-rank.r4,.hb-rank.r5{color:var(--ink-2)}
  .hb-rank.r6,.hb-rank.r7,.hb-rank.r8,.hb-rank.r9,.hb-rank.r10{color:var(--ink-3)}
  .hb-body{flex:1;min-width:0}
  .hb-title{font-size:14.5px;font-weight:600;line-height:1.5}
  .hb-row:hover .hb-title{color:var(--accent-ink)}
  .hb-meta{display:block;font-size:11.5px;color:var(--ink-3);margin-top:4px}
  .hb-right{flex:none;display:flex;align-items:center;gap:12px}
  .hb-heat{font-size:13px;font-weight:700;color:var(--ink-2)}
  .hb-trend{font-size:11.5px;font-weight:600}
  .hb-trend.up{color:#FF2E4C}.hb-trend.down{color:#8A8F99}.hb-trend.flat{color:var(--ink-3)}

  /* 关于页 */
  .about{max-width:680px}
  .about h1{font-size:28px;font-weight:800;letter-spacing:1px;margin-bottom:6px}
  .about .about-sub{font-size:13px;color:var(--ink-3);margin-bottom:30px;letter-spacing:.5px}
  .about-sec{margin-bottom:26px}
  .about-sec h3{font-size:14px;font-weight:700;margin-bottom:8px;padding-left:10px;border-left:3px solid var(--accent)}
  .about-sec p{font-size:14px;line-height:1.85;color:var(--ink-2)}
  .about-cta{margin-top:36px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px;text-align:center;box-shadow:var(--shadow)}
  .about-cta h4{font-size:16px;font-weight:700;margin-bottom:6px}
  .about-cta p{font-size:13px;color:var(--ink-2);margin-bottom:14px}
  .about-cta .btn-orange{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:10px 28px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .about-cta .btn-orange:hover{background:var(--accent-ink)}

  /* AI日报页 */
  .daily-head{margin-bottom:28px}
  .daily-kicker{font-size:11px;color:var(--accent);letter-spacing:2px;font-weight:700;margin-bottom:8px}
  .daily-head h1{font-size:26px;font-weight:800;margin-bottom:6px}
  .daily-sub{font-size:13px;color:var(--ink-3)}

/* ===== 栏目 chips ===== */
document.querySelectorAll('#catRow .chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('#catRow .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); state.cat=c.dataset.cat; renderFeed();
});

/* ===== 时间筛选 ===== */
document.querySelectorAll('#timeFilters .chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('#timeFilters .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); state.time=c.dataset.t; renderFeed();
});

/* ===== 过滤 ===== */
function filtered(){
  let list=RAW.slice();
  // 视图
  if(state.view==='fav') list=list.filter(i=>state.saved.has(i.id));
  else if(state.view==='daily') list=list.filter(i=>i.t==='today');
  else if(state.view==='hot') list=list.sort((a,b)=>b.heat-a.heat);
  // 栏目分类
  if(state.cat!=='all') list=list.filter(i=>i.cat===state.cat);
  // 平台/行业（全部动态页）
  if(state.plat!=='all') list=list.filter(i=>i.ch===state.plat);
  if(state.ind!=='all') list=list.filter(i=>i.ch===state.ind);
  // 时间
  if(state.time==='today') list=list.filter(i=>i.t==='today');
  if(state.time==='week') list=list.filter(i=>i.t==='week'||i.t==='today');
  // 搜索
  if(state.q){const k=state.q.toLowerCase();list=list.filter(i=>i.title.toLowerCase().includes(k)||i.desc.toLowerCase().includes(k)||i.src.toLowerCase().includes(k));}
  if(state.onlyUnread) list=list.filter(i=>!state.read.has(i.id));
  return list;
}

let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function openFeedback(){
  const ov=document.createElement('div');ov.className='ov';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML=`<div style="background:#fff;border-radius:12px;width:100%;max-width:420px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.12)">
    <h3 style="margin:0 0 4px;font-size:16px">反馈给侯同学</h3>
    <p style="margin:0 0 16px;font-size:12.5px;color:var(--ink-3)">发现错误、想补充信息、或有建议，写在这里。</p>
    <textarea id="fbText" rows="4" placeholder="你想说的…" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;resize:vertical;outline:none;box-sizing:border-box;font-family:inherit"></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
      <button id="fbCancel" style="padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13.5px">取消</button>
      <button id="fbSend" style="padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:13.5px;font-weight:600">提交反馈</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#fbCancel').onclick=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.querySelector('#fbSend').onclick=()=>{
    const v=ov.querySelector('#fbText').value.trim();
    if(!v){toast('写点内容再提交');return;}
    ov.remove();toast('反馈已收到，感谢！');
  };
}
function resetAll(){state.view='all';state.cat='all';state.time='all';state.q='';state.onlyUnread=false;$('#q').value='';document.querySelectorAll('#catRow .chip').forEach((c,i)=>c.classList.toggle('on',i===0));document.querySelectorAll('#timeFilters .chip').forEach((c,i)=>c.classList.toggle('on',i===0));renderNav();renderFeed();}

async function init(){
  try{
    const dataUrl = new URL('data.json', document.baseURI);
    dataUrl.searchParams.set('t', Date.now());
    const r = await fetch(dataUrl, {cache:'no-store'});
    if(!r.ok) throw new Error(`data.json HTTP ${r.status}`);
    const j = await r.json();
    if(!Array.isArray(j)) throw new Error('data.json 必须是 JSON 数组');
    if(j.length) RAW = j;
  }catch(e){console.warn('AIBEEP：资讯加载失败，使用内置示例数据。', e);}
  state.saved = new Set(RAW.filter(i=>i.st).map(i=>i.id));
  renderHeader(); renderStats(); renderNav(); renderFeed(); renderFocus(); renderHot();
  loadCollectionStatus();
}
async function loadCollectionStatus(){
  const el=$('#collectionStatus');
  try{
    const url=new URL('collection_status.json',document.baseURI);url.searchParams.set('t',Date.now());
    const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('状态不可用');
    const status=await response.json();
    const label={success:'采集完成',partial:'采集完成 · 部分来源异常',failed:'本轮采集失败 · 保留上次数据'}[status.status];
    const date=new Date(status.completed_at);if(!label || Number.isNaN(date.getTime()))throw new Error('状态格式无效');
    const time=date.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    el.textContent=`${label} · ${time}（北京时间） · 本次新增 ${Number(status.added)||0} 条`;
    el.title=`更新 ${Number(status.updated)||0} 条，筛除 ${Number(status.filtered)||0} 条；${Number(status.sources_with_errors)||0}/${Number(status.sources_total)||0} 个来源存在异常`;
  }catch(e){el.textContent='暂无可用采集状态';}
}
init();
</script>
</body>
